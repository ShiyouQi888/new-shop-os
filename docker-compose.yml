services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: shop-os-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_FILE: /data/shop-os.db
      UPLOAD_DIR: /uploads
      BASE_URL: ${SERVER_BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?请先在 .env 中设置 JWT_SECRET（生成示例：openssl rand -hex 32），不要使用示例默认值}
      AUTO_SEED: ${AUTO_SEED:-1}
    volumes:
      - shop_os_data:/data
      - shop_os_uploads:/uploads
    ports:
      - "${SERVER_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: shop-os-admin
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-5173}:80"

  shop:
    build:
      context: .
      dockerfile: apps/shop/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: shop-os-shop
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${SHOP_PORT:-5176}:80"

volumes:
  shop_os_data:
  shop_os_uploads:
